[project]
name = "say-it-with-me"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI declares parameters with calls in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]